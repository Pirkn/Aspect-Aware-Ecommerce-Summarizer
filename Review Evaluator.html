<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Review Evaluator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f7f5;
    --surface: #ffffff;
    --border: #e8e5e0;
    --text: #1a1814;
    --muted: #7a7670;
    --student: oklch(52% 0.16 250);
    --teacher: oklch(52% 0.16 155);
    --student-bg: oklch(97% 0.04 250);
    --teacher-bg: oklch(97% 0.04 155);
    --student-border: oklch(85% 0.08 250);
    --teacher-border: oklch(85% 0.08 155);
    --good: oklch(60% 0.16 155);
    --mid: oklch(62% 0.16 75);
    --low: oklch(58% 0.16 30);
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: flex-start; gap: 16px; }
  .product-badge { width: 44px; height: 44px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .product-info { flex: 1; }
  .product-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 3px; }
  .product-title { font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--text); }
  .header-stats { display: flex; gap: 20px; flex-shrink: 0; align-items: center; }
  .stat { text-align: right; }
  .stat-val { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Main layout */
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 32px; display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }

  /* Sidebar */
  .sidebar { position: sticky; top: 24px; }
  .sidebar-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0 4px; }
  .aspect-btn { width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: 10px 14px; border-radius: 8px; margin-bottom: 3px; transition: all 0.15s; }
  .aspect-btn:hover { background: var(--border); }
  .aspect-btn.active { background: var(--text); color: white; }
  .aspect-name { font-size: 13px; font-weight: 500; display: block; }
  .aspect-sub { font-size: 11px; opacity: 0.6; display: block; margin-top: 1px; }
  .aspect-btn.active .aspect-sub { opacity: 0.6; }
  .evidence-count { display: inline-block; font-size: 10px; font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.08); border-radius: 4px; padding: 1px 5px; float: right; margin-top: 1px; }
  .aspect-btn.active .evidence-count { background: rgba(255,255,255,0.2); }

  /* Content */
  .content { display: flex; flex-direction: column; gap: 20px; }

  /* Summary cards */
  .summaries { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .summary-card { border-radius: 12px; padding: 18px 20px; border: 1px solid; }
  .summary-card.student { background: var(--student-bg); border-color: var(--student-border); }
  .summary-card.teacher { background: var(--teacher-bg); border-color: var(--teacher-border); }
  .summary-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .summary-card.student .summary-label { color: var(--student); }
  .summary-card.teacher .summary-label { color: var(--teacher); }
  .label-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .student .label-dot { background: var(--student); }
  .teacher .label-dot { background: var(--teacher); }
  .summary-text { font-size: 14px; line-height: 1.55; font-weight: 400; color: var(--text); }

  /* Section heading */
  .section-head { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Evidence list */
  .evidence-list { display: flex; flex-direction: column; gap: 12px; }
  .ev-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: box-shadow 0.2s; }
  .ev-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .ev-header { padding: 14px 16px 10px; display: flex; align-items: center; gap: 12px; }
  .ev-rank { width: 26px; height: 26px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; color: var(--muted); }
  .ev-matched { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; font-style: italic; }
  .ev-matched::before { content: '"'; }
  .ev-matched::after { content: '"'; }
  .ev-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .rating-stars { display: flex; gap: 1px; }
  .star { font-size: 11px; }
  .ev-scores { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-label { font-size: 10px; color: var(--muted); width: 80px; flex-shrink: 0; font-weight: 500; letter-spacing: 0.02em; }
  .score-bar-bg { flex: 1; height: 5px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .score-bar { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .score-val { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--muted); width: 38px; text-align: right; flex-shrink: 0; }

  /* Full review expand */
  .ev-full-review { padding: 12px 16px; background: var(--surface); font-size: 12.5px; line-height: 1.7; color: var(--text); }
  .highlight { background: oklch(93% 0.12 75); border-radius: 3px; padding: 0 2px; font-weight: 500; }

  /* MMR rank chip */
  .mmr-chip { font-size: 9px; font-family: 'JetBrains Mono', monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--muted); }

  /* Review id chip */
  .review-chip { font-size: 9px; font-family: 'JetBrains Mono', monospace; color: var(--muted); }

  @media (max-width: 780px) {
    .main { grid-template-columns: 1fr; padding: 16px; }
    .sidebar { position: static; display: flex; gap: 6px; flex-wrap: wrap; }
    .aspect-btn { width: auto; display: inline-block; }
    .summaries { grid-template-columns: 1fr; }
    .header-inner { flex-wrap: wrap; }
    .header-stats { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const SUMMARIES = [
  { aspect: "kargo", student: "Kargo hızlı ve teslimat süreci sorunsuz görünüyor.", teacher: "Kargo hızlı ve teslimat sorunsuz görünüyor." },
  { aspect: "paketleme", student: "Paketleme sağlam ve ürün iyi korunmuş görünüyor.", teacher: "Paketin sağlam geldiği belirtiliyor." },
  { aspect: "fiyat_performans", student: "Ürün fiyatına göre oldukça iyi bir performans sunuyor.", teacher: "Ürün fiyatına göre başarılı ve alınabilir bulunuyor." },
  { aspect: "kalite", student: "Ürünün performansının ve kullanım kolaylığının iyi olduğu, işini iyi yaptığı belirtiliyor.", teacher: "Temizlik ve haritalama performansı beğeniliyor." },
  { aspect: "genel_memnuniyet", student: "Kullanıcılar üründen genel olarak çok memnun kalmış ve tavsiye etmiş.", teacher: "Kullanıcılar üründen memnun ve tavsiye ediyor." },
];

const EVIDENCE = [
  { aspect:"kargo", rank:1, similarity:0.7342, matched:"şık tam bir performans ürünü kargo da hızlıydı.", review_id:26, rating:5.0, mmr_rank:3, relevance:0.4968, full:"Ürünü gelir gelmez hemen denedim gayet güzel. şık tam bir performans ürünü kargo da hızlıydı. buğun sipariş verdim ertesi gün geldi. teşekkür." },
  { aspect:"kargo", rank:2, similarity:0.7312, matched:"hem hızlı kargo hem sağlam paket hemde kaliteli ürün.", review_id:20, rating:5.0, mmr_rank:1, relevance:0.5824, full:"Oturum kullanım alanı 100 metre kare evi tek şarj ve tek depo su ile hem siliyor. hem süpürüyor hem de en güçlü emme modun da bile… Sadece evdeki wifi sıkıntımdan dolayı bazen ayrı ayrı oda temizliğinde sorun yaşayabiliyorum. ama dediğim gibi o benim wifi ağımdan kaynaklı bir sorun… Çok memnunum… Hem fiyat olarak. hem hızlı kargo hem sağlam paket hemde kaliteli ürün. Tüketici olarak daha ne isteyebilirim:) Çok teşekkürler…" },
  { aspect:"kargo", rank:3, similarity:0.5371, matched:"buğun sipariş verdim ertesi gün geldi.", review_id:26, rating:5.0, mmr_rank:2, relevance:0.4563, full:"Ürünü gelir gelmez hemen denedim gayet güzel. şık tam bir performans ürünü kargo da hızlıydı. buğun sipariş verdim ertesi gün geldi. teşekkür." },
  { aspect:"paketleme", rank:1, similarity:0.5619, matched:"hem hızlı kargo hem sağlam paket hemde kaliteli ürün.", review_id:20, rating:5.0, mmr_rank:1, relevance:0.3366, full:"Oturum kullanım alanı 100 metre kare evi tek şarj ve tek depo su ile hem siliyor. hem süpürüyor hem de en güçlü emme modun da bile… Sadece evdeki wifi sıkıntımdan dolayı bazen ayrı ayrı oda temizliğinde sorun yaşayabiliyorum. ama dediğim gibi o benim wifi ağımdan kaynaklı bir sorun… Çok memnunum… Hem fiyat olarak. hem hızlı kargo hem sağlam paket hemde kaliteli ürün. Tüketici olarak daha ne isteyebilirim:) Çok teşekkürler…" },
  { aspect:"fiyat_performans", rank:1, similarity:0.7358, matched:"Uygun fiyat ve iyi performans.", review_id:4, rating:5.0, mmr_rank:2, relevance:0.5876, full:"Beklentimizi karşıladı… Uygun fiyat ve iyi performans." },
  { aspect:"fiyat_performans", rank:2, similarity:0.7273, matched:"Bu fiyata iyi bir ürün.", review_id:15, rating:4.0, mmr_rank:12, relevance:0.3857, full:"Bu fiyata iyi bir ürün. Birkaç kronnik problemi var. Uygulamada sınırladığınız alanlara bir süre sonra girmeye başlıyor. Tekrar harita oluşturmak gerekiyor. Ayda bir bunu yapmak gerekiyor. Sarjının bitmemesine dikkat edin. Aksi halde uygulamada hata veriyor ve %100 olana kadar bağlanmıyor. Su ve toz haznesi oda geçişlerindeki minin eşiklerden geçerken çıkabiliyor. İyi oturtturmak gerekiyor. Toz hanesi bazen tozu içine almıyor. Açıp sürekli daha dolmadan boşaltmak gerekiyor. Üst modellerdeki gibi evdeki kabloları görmüyor. dolanabiliyor. Islak özelliği güzel. Her temizlik sonrasında onunda temizlenmesi gerekiyor." },
  { aspect:"fiyat_performans", rank:3, similarity:0.7161, matched:"Fiyat performans ve kullanım kolaylığı açısından memnun edici olduğu söylenebilir…", review_id:3, rating:5.0, mmr_rank:7, relevance:0.4537, full:"Fiyat performans ve kullanım kolaylığı açısından memnun edici olduğu söylenebilir…" },
  { aspect:"fiyat_performans", rank:4, similarity:0.71, matched:"Tam bir fiyat performans ürünü çekiş gücü gayet iyi.", review_id:29, rating:5.0, mmr_rank:3, relevance:0.5024, full:"Tam bir fiyat performans ürünü çekiş gücü gayet iyi. oda taraması konusunda hiç sorun yaşamadık 145 m2 evi tek şarj 2. seviyede temizleyebiliyor. sadece süpürmesi için aldık evde bebek olduğu için günlük toz temizleme faaliyetlerini yürütüyor. temizlediği alanı kontrol etmek için emektar dyson yeşil ışığına başvurduk. tam not aldı homerun uygulaması gayet kullanışlı. bu fiyata alınabilecek en mantıklı ürün…" },
  { aspect:"fiyat_performans", rank:5, similarity:0.6257, matched:"Fiyatına göre çok çok iyi bir ürün…", review_id:17, rating:5.0, mmr_rank:16, relevance:0.3197, full:"Harika bir ürün kesinlikle tavsiye ederim… Fiyatına göre çok çok iyi bir ürün…" },
  { aspect:"kalite", rank:1, similarity:0.4863, matched:"Tam bir fiyat performans ürünü çekiş gücü gayet iyi.", review_id:29, rating:5.0, mmr_rank:4, relevance:0.3654, full:"Tam bir fiyat performans ürünü çekiş gücü gayet iyi. oda taraması konusunda hiç sorun yaşamadık 145 m2 evi tek şarj 2. seviyede temizleyebiliyor. sadece süpürmesi için aldık evde bebek olduğu için günlük toz temizleme faaliyetlerini yürütüyor. temizlediği alanı kontrol etmek için emektar dyson yeşil ışığına başvurduk. tam not aldı homerun uygulaması gayet kullanışlı. bu fiyata alınabilecek en mantıklı ürün…" },
  { aspect:"genel_memnuniyet", rank:1, similarity:0.6962, matched:"Fiyat performans ve kullanım kolaylığı açısından memnun edici olduğu söylenebilir…", review_id:3, rating:5.0, mmr_rank:6, relevance:0.3765, full:"Fiyat performans ve kullanım kolaylığı açısından memnun edici olduğu söylenebilir…" },
  { aspect:"genel_memnuniyet", rank:2, similarity:0.6877, matched:"Ürünü gelir gelmez hemen denedim gayet güzel.", review_id:26, rating:5.0, mmr_rank:12, relevance:0.3807, full:"Ürünü gelir gelmez hemen denedim gayet güzel. şık tam bir performans ürünü kargo da hızlıydı. buğun sipariş verdim ertesi gün geldi. teşekkür." },
  { aspect:"genel_memnuniyet", rank:3, similarity:0.6199, matched:"Harika bir ürün kesinlikle tavsiye ederim…", review_id:17, rating:5.0, mmr_rank:9, relevance:0.4055, full:"Harika bir ürün kesinlikle tavsiye ederim… Fiyatına göre çok çok iyi bir ürün…" },
  { aspect:"genel_memnuniyet", rank:4, similarity:0.6095, matched:"Ürünü kullanmaya başlar başlamaz en çok etkilendiğim şey harita çıkarma başarısı oldu.", review_id:1, rating:5.0, mmr_rank:3, relevance:0.3573, full:"Ürünü kullanmaya başlar başlamaz en çok etkilendiğim şey harita çıkarma başarısı oldu. Evi çok kısa sürede detaylı ve doğru şekilde tarıyor; odaları net ayırıyor. neredeyse hiç şaşırmıyor. Harita üzerinde oda seçmek. alan belirlemek çok pratik. Uygulama kurulumu da beklediğimden çok daha kolaydı. Cihazı açtım. uygulamayı kurdum ve birkaç adımda ev Wi-Fi ağına hemen bağlandı. Hiç uğraştırmadan çalışmaya başlaması gerçekten büyük rahatlık. Bir diğer güzel detay ise Türkçe konuşması. Komutları ve bildirimleri Türkçe vermesi kullanımı çok daha keyifli hale getiriyor. Ne yaptığını anında anlıyorsun. ekstra uğraş yok. Kısacası akıllı pratik ve kullanıcı dostu bir robot süpürge arayanlar için gönül rahatlığıyla öneririm. 🧹✨." },
  { aspect:"genel_memnuniyet", rank:5, similarity:0.6028, matched:"şık tam bir performans ürünü kargo da hızlıydı.", review_id:26, rating:5.0, mmr_rank:17, relevance:0.3143, full:"Ürünü gelir gelmez hemen denedim gayet güzel. şık tam bir performans ürünü kargo da hızlıydı. buğun sipariş verdim ertesi gün geldi. teşekkür." },
];

const ASPECT_LABELS = {
  kargo: { tr: "Kargo", en: "Shipping" },
  paketleme: { tr: "Paketleme", en: "Packaging" },
  fiyat_performans: { tr: "Fiyat/Performans", en: "Price / Value" },
  kalite: { tr: "Kalite", en: "Quality" },
  genel_memnuniyet: { tr: "Genel Memnuniyet", en: "Overall Satisfaction" },
};

function scoreColor(v) {
  if (v >= 0.7) return 'var(--good)';
  if (v >= 0.5) return 'var(--mid)';
  return 'var(--low)';
}

function Stars({ rating }) {
  const full = Math.floor(rating);
  return (
    <div className="rating-stars">
      {[1,2,3,4,5].map(i => (
        <span key={i} className="star" style={{color: i <= full ? '#e8a822' : '#ddd'}}>★</span>
      ))}
    </div>
  );
}

function highlightInText(full, matched) {
  const idx = full.toLowerCase().indexOf(matched.toLowerCase());
  if (idx === -1) return <span>{full}</span>;
  return <>
    <span>{full.slice(0, idx)}</span>
    <span className="highlight">{full.slice(idx, idx + matched.length)}</span>
    <span>{full.slice(idx + matched.length)}</span>
  </>;
}

function EvidenceCard({ ev }) {
  return (
    <div className="ev-card">
      <div className="ev-header">
        <div className="ev-rank">#{ev.rank}</div>
        <div className="ev-matched" style={{fontStyle:'normal', fontWeight:400, fontSize:12, color:'var(--muted)'}}>
          Review #{ev.review_id}
        </div>
        <div className="ev-meta">
          <Stars rating={ev.rating} />
        </div>
      </div>
      <div className="ev-full-review" style={{borderTop:'none', paddingTop:0}}>
        {highlightInText(ev.full, ev.matched)}
      </div>
      <div className="ev-scores" style={{borderTop:'1px solid var(--border)', paddingTop:12}}>
        <div className="score-row">
          <span className="score-label">Similarity</span>
          <div className="score-bar-bg">
            <div className="score-bar" style={{width: `${ev.similarity*100}%`, background: scoreColor(ev.similarity)}}/>
          </div>
          <span className="score-val" style={{color: scoreColor(ev.similarity)}}>{ev.similarity.toFixed(4)}</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeAspect, setActiveAspect] = React.useState('kargo');
  const aspects = SUMMARIES.map(s => s.aspect);
  const currentSummary = SUMMARIES.find(s => s.aspect === activeAspect);
  const currentEvidence = EVIDENCE.filter(e => e.aspect === activeAspect);
  const avgSim = currentEvidence.length
    ? (currentEvidence.reduce((a,b) => a+b.similarity, 0) / currentEvidence.length).toFixed(3)
    : '—';

  return (
    <div className="app">
      <div className="header">
        <div className="header-inner">
          <div className="product-badge">🤖</div>
          <div className="product-info">
            <div className="product-id">B0FVYFD3HZ · Student vs Teacher Summary Review</div>
            <div className="product-title">Philips HomeRun 2000 Robot Süpürge ve Paspas — 6000 PA, Halı Modu, LDS Radar, HomeRun Uygulaması</div>
          </div>
          <div className="header-stats">
            <div className="stat">
              <div className="stat-val" style={{color:'var(--student)'}}>{SUMMARIES.length}</div>
              <div className="stat-label">Aspects</div>
            </div>
            <div className="stat">
              <div className="stat-val">{EVIDENCE.length}</div>
              <div className="stat-label">Evidence</div>
            </div>
            <div className="stat">
              <div className="stat-val" style={{color:'var(--good)'}}>
                {(EVIDENCE.reduce((a,b)=>a+b.similarity,0)/EVIDENCE.length).toFixed(3)}
              </div>
              <div className="stat-label">Avg Sim.</div>
            </div>
          </div>
        </div>
      </div>

      <div className="main">
        <div className="sidebar">
          <div className="sidebar-title">Aspects</div>
          {aspects.map(a => {
            const cnt = EVIDENCE.filter(e => e.aspect === a).length;
            const label = ASPECT_LABELS[a];
            return (
              <button
                key={a}
                className={`aspect-btn ${activeAspect === a ? 'active' : ''}`}
                onClick={() => setActiveAspect(a)}
              >
                <span className="aspect-name">{label.tr}</span>
                <span className="aspect-sub">{label.en} <span className="evidence-count">{cnt}</span></span>
              </button>
            );
          })}
        </div>

        <div className="content">
          {/* Summary comparison */}
          <div>
            <div className="section-head">Summary Comparison</div>
            <div className="summaries">
              <div className="summary-card student">
                <div className="summary-label">
                  <span className="label-dot student" style={{background:'var(--student)'}}/>
                  Student
                </div>
                <div className="summary-text">{currentSummary.student}</div>
              </div>
              <div className="summary-card teacher">
                <div className="summary-label">
                  <span className="label-dot teacher" style={{background:'var(--teacher)'}}/>
                  Teacher (Ground Truth)
                </div>
                <div className="summary-text">{currentSummary.teacher}</div>
              </div>
            </div>
          </div>

          {/* Evidence */}
          <div>
            <div className="section-head">
              Supporting Evidence
              <span style={{fontWeight:400, textTransform:'none', letterSpacing:0, color:'var(--muted)', fontSize:11}}>
                {currentEvidence.length} reviews · avg similarity {avgSim}
              </span>
            </div>
            <div className="evidence-list">
              {currentEvidence.map((ev, i) => <EvidenceCard key={i} ev={ev} />)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
